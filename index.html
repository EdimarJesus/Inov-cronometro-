<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoramento de Performance Promopack</title>
  <style>
    html { -webkit-text-size-adjust: 100%; }
    button, input { font: inherit; }
    button { -webkit-appearance: none; appearance: none; touch-action: manipulation; }
    input { -webkit-appearance: none; appearance: none; }

    * { box-sizing: border-box; }
    :root {
      --bg: #0f1117;
      --card: #191d27;
      --card2: #202531;
      --text: #f5f7fb;
      --muted: #9ba4b5;
      --primary: #f2c94c;
      --primaryText: #171717;
      --danger: #ef5350;
      --success: #35c46a;
      --border: rgba(255,255,255,.09);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #242a36 0%, var(--bg) 48%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .app {
      width: min(100%, 560px);
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }

    .logo {
      display: block;
      width: min(92%, 430px);
      max-height: 150px;
      object-fit: contain;
      border-radius: 10px;
      mix-blend-mode: normal;
    }

    .header h1 {
      margin: 0 0 6px;
      font-size: clamp(24px, 6vw, 34px);
    }

    .header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      background: rgba(25, 29, 39, .96);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 18px 50px rgba(0,0,0,.28);
      margin-bottom: 14px;
    }

    .section-title {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .config {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--card2);
      color: var(--text);
      border-radius: 12px;
      padding: 12px 8px;
      font-size: 20px;
      text-align: center;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
    }

    input:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .timer {
      text-align: center;
      font-size: clamp(62px, 18vw, 112px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      margin: 20px 0 12px;
    }

    .seconds-live {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      margin-top: -4px;
      margin-bottom: 8px;
      font-variant-numeric: tabular-nums;
    }

    .status.running + * { }

    .timer.running {
      animation: timerPulse 1s ease-in-out infinite;
    }

    @keyframes timerPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .78; }
    }

    .milliseconds {
      font-size: 0.42em;
      font-weight: 700;
      letter-spacing: 0;
      vertical-align: baseline;
      opacity: .9;
    }

    .status {
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--muted);
      min-height: 20px;
    }

    .status.running { color: var(--success); }
    .status.paused { color: var(--primary); }
    .status.finished { color: var(--danger); }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 15px 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .08s ease, opacity .15s ease;
      touch-action: manipulation;
    }

    button:active { transform: scale(.97); }
    button:disabled { opacity: .35; cursor: not-allowed; }

    .primary {
      background: var(--primary);
      color: var(--primaryText);
    }

    .secondary {
      background: #303746;
      color: var(--text);
    }

    .danger {
      background: var(--danger);
      color: white;
    }

    .counter {
      text-align: center;
    }

    .counter-value {
      font-size: clamp(70px, 20vw, 120px);
      line-height: 1;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      margin: 10px 0;
    }

    .counter-limit {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 18px;
    }

    .plus {
      width: 100%;
      min-height: 86px;
      font-size: 34px;
      background: var(--primary);
      color: var(--primaryText);
      border-radius: 18px;
    }

    .plus:disabled {
      background: #4b515e;
      color: #aeb5c0;
    }

    .reset {
      width: 100%;
      margin-top: 10px;
    }

    .finished-panel {
      display: none;
      text-align: center;
      padding: 12px;
      margin-top: 14px;
      border-radius: 12px;
      background: rgba(239,83,80,.12);
      color: #ff8a87;
      font-weight: 700;
    }

    .finished-panel.show { display: block; }

    .footer {
      text-align: center;
      color: #9ba4b5;
      font-size: 12px;
      margin: 18px 0 4px;
      letter-spacing: .3px;
    }

    .footer strong {
      color: #f2c94c;
      font-weight: 800;
    }

    @media (max-width: 420px) {
      body { padding: 10px; }
      .card { padding: 17px; border-radius: 18px; }
      .buttons { grid-template-columns: 1fr; }
      .config { gap: 7px; }
    }
  </style>
<meta name="theme-color" content="#0f1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="INOV Cronômetro">
  <meta name="mobile-web-app-capable" content="yes">
<style>
/* Ajuste compacto: todo o painel principal deve caber em uma única tela */
body {
  min-height: 100dvh;
}

main, .container, .app, .app-container {
  min-height: 0 !important;
}

header {
  padding-top: 8px !important;
  padding-bottom: 4px !important;
}

header img, .logo, .logo img {
  max-height: 92px !important;
  height: auto !important;
  width: auto !important;
  object-fit: contain !important;
  margin: 0 auto 6px !important;
}

h1 {
  font-size: clamp(22px, 5.5vw, 32px) !important;
  line-height: 1.08 !important;
  margin: 4px 0 10px !important;
  text-align: center;
}

section, .card, .panel, .timer-card, .counter-card {
  margin-top: 10px !important;
  margin-bottom: 10px !important;
  padding-top: 14px !important;
  padding-bottom: 14px !important;
}

@media (max-width: 600px) {
  body {
    overflow-x: hidden;
  }

  header img, .logo, .logo img {
    max-height: 72px !important;
  }

  h1 {
    font-size: 22px !important;
    margin-bottom: 8px !important;
  }

  section, .card, .panel, .timer-card, .counter-card {
    padding: 12px !important;
    border-radius: 22px !important;
  }

  .timer-display, #timer, .time-display {
    font-size: clamp(46px, 13vw, 76px) !important;
  }

  button {
    min-height: 52px !important;
  }
}
</style>
</head>

      <h1>Monitoramento de Performance Promopack</h1>
      
    </header>

    <section class="card">
      <div class="section-title">Configuração do tempo</div>

      <div class="config">
        <div class="field">
          <label for="hours">Horas</label>
          <input id="hours" type="number" min="0" max="23" value="0" inputmode="numeric">
        </div>
        <div class="field">
          <label for="minutes">Minutos</label>
          <input id="minutes" type="number" min="0" max="59" value="1" inputmode="numeric">
        </div>
        <div class="field">
          <label for="seconds">Segundos</label>
          <input id="seconds" type="number" min="0" max="59" value="0" inputmode="numeric">
        </div>
      </div>

      <div id="timer" class="timer">01:00<span class="milliseconds">.000</span></div>
      <div id="secondsLive" class="seconds-live">60 segundos restantes</div>
      <div id="status" class="status">PRONTO</div>

      <div class="buttons">
        <button id="startBtn" class="primary">INICIAR</button>
        <button id="pauseBtn" class="secondary" disabled>PAUSAR</button>
      </div>

      <div id="finishedPanel" class="finished-panel">
        TEMPO FINALIZADO
      </div>
    </section>

    <section class="card counter">
      <div class="section-title">Contador</div>
      <div id="counterValue" class="counter-value">0</div>
      <div class="counter-limit">Limite: 100</div>
      <button id="plusBtn" class="plus">+1</button>
    </section>

    <button id="resetBtn" class="danger reset">RESETAR TUDO</button>

    <footer class="footer">
      Desenvolvido por <strong>Edimar Sardeiro</strong>
    </footer>
  </main>

  <script>
    const hoursInput = document.getElementById('hours');
    const minutesInput = document.getElementById('minutes');
    const secondsInput = document.getElementById('seconds');

    const timerEl = document.getElementById('timer');
    const secondsLiveEl = document.getElementById('secondsLive');
    const statusEl = document.getElementById('status');
    const finishedPanel = document.getElementById('finishedPanel');

    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const plusBtn = document.getElementById('plusBtn');
    const counterValueEl = document.getElementById('counterValue');

    let totalSeconds = 60;
    let remainingMs = 60000;
    let endTimestamp = null;
    let timerId = null;
    let state = 'ready'; // ready | running | paused | finished
    let counter = 0;

    function getConfiguredSeconds() {
      const h = Math.max(0, Math.min(23, Number(hoursInput.value) || 0));
      const m = Math.max(0, Math.min(59, Number(minutesInput.value) || 0));
      const s = Math.max(0, Math.min(59, Number(secondsInput.value) || 0));
      return h * 3600 + m * 60 + s;
    }

    function formatTime(total) {
      const safe = Math.max(0, Math.floor(total));
      const h = Math.floor(safe / 3600);
      const m = Math.floor((safe % 3600) / 60);
      const s = safe % 60;

      if (h > 0) {
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function render() {
      const wholeSeconds = Math.floor(Math.max(0, remainingMs) / 1000);
      const milliseconds = Math.max(0, Math.floor(remainingMs % 1000));
      timerEl.innerHTML = `${formatTime(wholeSeconds)}<span class="milliseconds">.${String(milliseconds).padStart(3, '0')}</span>`;
      const remainingSeconds = Math.ceil(Math.max(0, remainingMs) / 1000);
      secondsLiveEl.textContent = `${remainingSeconds} ${remainingSeconds === 1 ? 'segundo' : 'segundos'} restantes`;
      timerEl.classList.toggle('running', state === 'running');
      counterValueEl.textContent = counter;

      statusEl.className = 'status';
      if (state === 'running') {
        statusEl.textContent = 'EM EXECUÇÃO';
        statusEl.classList.add('running');
      } else if (state === 'paused') {
        statusEl.textContent = 'PAUSADO';
        statusEl.classList.add('paused');
      } else if (state === 'finished') {
        statusEl.textContent = 'FINALIZADO';
        statusEl.classList.add('finished');
      } else {
        statusEl.textContent = 'PRONTO';
      }

      const locked = state === 'running' || state === 'paused';
      hoursInput.disabled = locked;
      minutesInput.disabled = locked;
      secondsInput.disabled = locked;

      startBtn.disabled = state === 'running' || state === 'finished';
      pauseBtn.disabled = state !== 'running';

      if (state === 'paused') {
        startBtn.textContent = 'CONTINUAR';
      } else {
        startBtn.textContent = 'INICIAR';
      }

      plusBtn.disabled = counter >= 100;
      finishedPanel.classList.toggle('show', state === 'finished');
    }

    function finishTimer() {
      clearInterval(timerId);
      timerId = null;
      remainingMs = 0;
      endTimestamp = null;
      state = 'finished';
      render();
    }

    function tick() {
      if (state !== 'running' || endTimestamp === null) return;

      remainingMs = Math.max(0, endTimestamp - Date.now());

      if (remainingMs <= 0) {
        finishTimer();
        return;
      }

      render();
    }

    function animateTimer() {
      if (state !== 'running') return;
      tick();
      if (state === 'running') {
        animationFrameId = requestAnimationFrame(animateTimer);
      }
    }

    function startTimer() {
      if (state === 'finished') return;

      if (state === 'ready') {
        totalSeconds = getConfiguredSeconds();

        if (totalSeconds <= 0) {
          alert('Configure um tempo maior que zero.');
          return;
        }

        remainingMs = totalSeconds * 1000;
      }

      if (state === 'paused') {
        // Continua exatamente do tempo restante.
      }

      endTimestamp = Date.now() + remainingMs;
      state = 'running';

      clearInterval(timerId);
      timerId = setInterval(tick, 16);
      tick();
      render();
    }

    function pauseTimer() {
      if (state !== 'running') return;

      tick();
      clearInterval(timerId);
      timerId = null;

      if (remainingMs <= 0) {
        finishTimer();
        return;
      }

      state = 'paused';
      endTimestamp = null;
      render();
    }

    function resetAll() {
      clearInterval(timerId);
      timerId = null;
      endTimestamp = null;

      totalSeconds = getConfiguredSeconds();
      remainingMs = totalSeconds > 0 ? totalSeconds * 1000 : 0;
      counter = 0;
      state = 'ready';

      render();
    }

    function incrementCounter() {
      if (counter < 100) {
        counter++;
        render();
      }
    }

    function updatePreview() {
      if (state !== 'ready') return;
      const configured = getConfiguredSeconds();
      remainingMs = configured * 1000;
      totalSeconds = configured;
      render();
    }

    [hoursInput, minutesInput, secondsInput].forEach(input => {
      input.addEventListener('input', updatePreview);
      input.addEventListener('change', updatePreview);
    });

    startBtn.addEventListener('click', startTimer);
    pauseBtn.addEventListener('click', pauseTimer);
    resetBtn.addEventListener('click', resetAll);
    plusBtn.addEventListener('click', incrementCounter);

    updatePreview();
  </script>
</body>
</html>
